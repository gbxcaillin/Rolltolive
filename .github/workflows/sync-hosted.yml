# Every push to a source branch runs the headless tests, then builds the server-hosted version onto a
# build branch of this same repo: main -> "hosted-main", feature/x -> "hosted-feature-x".
# Deploy platforms point at the "hosted-main" branch. Pushes made by GITHUB_TOKEN do not re-trigger this workflow.
name: sync-hosted
on:
  push:
    branches-ignore: ['hosted-**']
    paths: ['index.html', 'art/**', 'server/**', 'hosted/**', 'NETWORK.md', 'tools/sync-hosted.sh', '.github/workflows/sync-hosted.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright (local install so require('playwright') resolves)
        run: |
          npm init -y > /dev/null
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run headless tests
        run: |
          node server/relay.js 8787 & sleep 1
          node tests/solo.test.js | tee /tmp/solo.log; grep -q "errors: none" /tmp/solo.log
          node tests/online.test.js | tee /tmp/online.log; grep -q "errors: none" /tmp/online.log
      - name: Build and push the hosted branch
        env:
          HOSTED_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          GIT_AUTHOR_NAME: ashfall-sync
          GIT_AUTHOR_EMAIL: sync@ashfall.local
        run: tools/sync-hosted.sh "$RUNNER_TEMP/hosted-build"
