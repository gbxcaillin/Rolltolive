# Publishes the offline build (index.html + art/) from main to GitHub Pages.
# Solo and Hotseat work as-is. Online needs a relay elsewhere: set a repository variable RELAY_URL
# (Settings → Secrets and variables → Actions → Variables), e.g. wss://ashfall.onrender.com, and it is stamped in.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'art/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env: { RELAY_URL: "${{ vars.RELAY_URL }}" }
        run: |
          mkdir -p site && cp index.html site/ && cp -R art site/art
          SHA=$(git rev-parse --short HEAD); STAMP=$(date -u +%Y%m%d-%H%M)
          sed -i "s/const BUILD = 'dev';/const BUILD = '$SHA $STAMP pages';/" site/index.html
          if [ -n "$RELAY_URL" ]; then sed -i "s#const RELAY_URL = '';#const RELAY_URL = '$RELAY_URL';#" site/index.html; fi
          grep -q "const BUILD = '$SHA" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
