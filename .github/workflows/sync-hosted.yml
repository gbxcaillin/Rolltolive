# Mirrors every push of this repo (offline/test source) into gbxcaillin/ashfall-hosted (server build),
# same branch name, after the headless test suite passes.
# Requires a repository secret HOSTED_REPO_TOKEN: a fine-grained PAT with "Contents: read and write" on ashfall-hosted.
name: sync-hosted
on:
  push:
    branches: ['**']
    paths: ['index.html', 'art/**', 'server/**', 'hosted/**', 'NETWORK.md', 'tools/sync-hosted.sh', '.github/workflows/sync-hosted.yml', 'tests/**']
  workflow_dispatch:
jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: npm i -g playwright && npx playwright install --with-deps chromium
      - name: Run headless tests
        run: |
          node server/relay.js 8787 & sleep 1
          node tests/solo.test.js | tee /tmp/solo.log; grep -q "errors: none" /tmp/solo.log
          node tests/online.test.js | tee /tmp/online.log; grep -q "errors: none" /tmp/online.log
      - name: Sync to ashfall-hosted
        env:
          HOSTED_REPO: https://x-access-token:${{ secrets.HOSTED_REPO_TOKEN }}@github.com/gbxcaillin/ashfall-hosted.git
          GIT_AUTHOR_NAME: ashfall-sync
          GIT_AUTHOR_EMAIL: sync@ashfall.local
        run: tools/sync-hosted.sh "$RUNNER_TEMP/ashfall-hosted"
